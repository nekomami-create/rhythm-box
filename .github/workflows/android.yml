name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:test testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BreakBox.apk

      # 配布は GitHub Release で行う。actions/upload-artifact は Actions の
      # ストレージ枠を消費して枠切れの原因になるため使わない
      # （Release のアセットはこの枠とは別に保存される）。
      - name: Publish APK to "rhythmbox-latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rhythmbox-latest
          name: "BreakBox 最新APK (v1.0.${{ github.run_number }})"
          body: |
            バージョン: 1.0.${{ github.run_number }} (コミット ${{ github.sha }})
            Android の「提供元不明のアプリ」を許可してインストールしてください。
          prerelease: true
          files: BreakBox.apk

      # 旧名 (RhythmBox.apk) のまま残ると、古いリンクから古い APK が落ちてしまう。
      - name: Remove the old RhythmBox.apk asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset rhythmbox-latest RhythmBox.apk --yes || true
