name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:test testDebugUnitTest --no-daemon

      # 配布用の鍵を secret から取り出す。置いていなければ何もせず、
      # ビルドはデバッグ鍵（公開鍵）に落ちる。どちらで署名したかは
      # Gradle のログに出るので、切り替わったかを目で確かめられる。
      - name: Restore the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "配布用の鍵が未設定です。デバッグ鍵で署名します。"
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi

      # 配布するのは release ビルド（debuggable が付かない）。
      # ビルド番号を APK に埋め込む。ヘルプの先頭に出るので、
      # どの APK を入れたのかを端末側で確かめられる。
      # 鍵のパスワードは環境変数で渡す。-P で渡すとコマンドラインに載り、
      # 同じ機械の別プロセスから見えてしまう。Gradle は ORG_GRADLE_PROJECT_ 付きの
      # 環境変数を、そのままプロジェクトのプロパティとして読む。
      - name: Assemble release APK
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ steps.keystore.outputs.path }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BreakBox.apk

      # 配布は GitHub Release で行う。actions/upload-artifact は Actions の
      # ストレージ枠を消費して枠切れの原因になるため使わない
      # （Release のアセットはこの枠とは別に保存される）。
      - name: Publish the rolling "latest" release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rhythmbox-latest
          name: "BreakBox 最新APK (build ${{ github.run_number }})"
          body: |
            main の最新ビルドです。いつも同じ URL から取得できます。
            コミット ${{ github.sha }}

            インストール: Android の「提供元不明のアプリ」を許可してから開いてください。
            上書きインストールで更新でき、保存した曲は残ります。
          prerelease: true
          files: BreakBox.apk

      # v1.2.3 のようなタグを押したときは、そのバージョンで固定のリリースを作る。
      - name: Publish a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BreakBox ${{ github.ref_name }}"
          body: |
            BreakBox ${{ github.ref_name }}

            インストール: Android の「提供元不明のアプリ」を許可してから開いてください。
            上書きインストールで更新でき、保存した曲は残ります。
          generate_release_notes: true
          files: BreakBox.apk

      # 旧名 (RhythmBox.apk) のまま残ると、古いリンクから古い APK が落ちてしまう。
      - name: Remove the old RhythmBox.apk asset
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset rhythmbox-latest RhythmBox.apk --yes || true
